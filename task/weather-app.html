<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../src/scripts/weather.js"></script>
</head>
<body class="container-fluid bg-dark text-light" onload="LoadWeatherData('Mumbai')">
    <header class="mt-2 p-2 d-flex justify-content-between align-items-center">
        <div>
            <span class="bi bi-cloud-drizzle fs-3 fw-bold"> Weather App</span>
        </div>
        <div>
            <div class="input-group " style="width: 500px;">
                <button onclick="SearchClick()" class="bi bi-search btn btn-secondary"></button>
                <input type="text" id="txtCity" placeholder="Your City name" class="form-control">
            </div>
        </div>
        <div>
            <button class="btn btn-secondary bi bi-person"></button>
            <button class="btn btn-secondary mx bi bi-heart"></button>
            <button class="btn btn-secondary mx bi bi-share-fill"></button>
        </div>
    </header>

    <section class="row mt-4 p-4">
        <div class="col-9">
            <h1 id="salutation"></h1>
            <div class="bg-secondary rounded rounded-4 p-5" style="height: 350px;">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fs-1 fw-bold" id="lblCity"></div>
                        <div class="fs-6" id="lblDate"></div>
                    </div>
                    <div>
                        <div class="rounded rounded-pill bg-light p-2"><span class="bi bi-geo-alt text-primary"> Current Location</span></div>
                    </div>
                </div>

                <div class="mt-2 row p-4">
                    <div class="col-4">
                        <div class="fw-bold" id="lblTemp" style="font-size:60px; font-family: Arial;"></div>
                    </div>
                    <div class="col-8">
                        <div class="bi bi-brightness-high-fill" style="font-size: 50px;"></div>
                        <div id="lblDescription"></div>
                    </div>
                </div>
            </div>
            <div class="row mt-4">
                <div class="bg-secondary col p-3 ms-2 rounded rounded-4" style="height: 200px;">
                    <div class="bi bi-droplet-fill fs-5"> Humidity</div>
                    <div id="lblHumidity" class="fs-2 fw-bold"></div>
                    <div class="mt-3 progress">
                        <div class="progress-bar" style="width:64%;" id="progressbar"></div>
                    </div>
                </div>

                <div class="bg-secondary mx-3 col p-4 rounded rounded-4" style="height: 200px;">
                    <div class="bi bi-wind fs-5"> Wind Speed</div>
                    <div id="lblWindspeed" class="fw-bold mt-2" style="font-size:30px;"></div>
                </div>

                <div class="bg-secondary col rounded rounded-4 p-4 me-2" style="height: 200px;">
                    <div class="fs-5">Sunrise & Sunset</div>
                    <div class="bi bi-sun-fill p-2 fw-bold fs-4 mt-2">
                        <span id="lblSunrise"></span>
                    </div>
                    <div class="bi bi-sunset p-2 fw-bold fs-4">
                        <span id="lblSunset"></span>
                    </div>
                </div>
            </div>      
        </div>

        <div class="col-3" style="padding-top:55px;">
            <div class="bg-secondary rounded rounded-4 p-3" style="height:350px;">
                <div class="fs-4 fw-bold text-light mb-2">
                    7-Day Forecast
                </div>
        
                <!-- Row -->
                <div class="d-flex align-items-center text-light p-2">
                    <div style="width:50px;" class="fw-bold">Tue</div>
                    <div style="width:120px;">
                        <span class="bi bi-cloud-fill text-primary"></span> Cloudy
                    </div>
                    <div style="width:60px;">75<sup>&deg;</sup></div>
                    <div style="width:60px;">62<sup>&deg;</sup></div>
                </div>
        
                <!-- Row -->
                <div class="d-flex align-items-center text-light p-2">
                    <div style="width:50px;" class="fw-bold">Wed</div>
                    <div style="width:120px;">
                        <span class="bi bi-sun-fill text-warning"></span> Sunny
                    </div>
                    <div style="width:60px;">69<sup>&deg;</sup></div>
                    <div style="width:60px;">81<sup>&deg;</sup></div>
                </div>
        
                <!-- Row -->
                <div class="d-flex align-items-center text-light p-2">
                    <div style="width:50px;" class="fw-bold">Thu</div>
                    <div style="width:120px;">
                        <span class="bi bi-sun-fill text-warning"></span> Sunny
                    </div>
                    <div style="width:60px;">55<sup>&deg;</sup></div>
                    <div style="width:60px;">76<sup>&deg;</sup></div>
                </div>
        
                <!-- Row -->
                <div class="d-flex align-items-center text-light p-2">
                    <div style="width:50px;" class="fw-bold">Fri</div>
                    <div style="width:120px;">
                        <span class="bi bi-cloud-rain text-primary"></span> Rain
                    </div>
                    <div style="width:60px;">60<sup>&deg;</sup></div>
                    <div style="width:60px;">71<sup>&deg;</sup></div>
                </div>
        
                <!-- Row -->
                <div class="d-flex align-items-center text-light p-2">
                    <div style="width:50px;" class="fw-bold">Sat</div>
                    <div style="width:120px;">
                        <span class="bi bi-sun-fill text-warning"></span> Sunny
                    </div>
                    <div style="width:60px;">79<sup>&deg;</sup></div>
                    <div style="width:60px;">49<sup>&deg;</sup></div>
                </div>

                <!-- Row -->
                <div class="d-flex align-items-center text-light p-2">
                    <div style="width:50px;" class="fw-bold">Sun</div>
                    <div style="width:120px;">
                        <span class="bi bi-cloud text-primary"></span> Cloudy
                    </div>
                    <div style="width:60px;">79<sup>&deg;</sup></div>
                    <div style="width:60px;">49<sup>&deg;</sup></div>
                </div>
        
                <!-- Button -->
                <div class="d-flex justify-content-center mt-2">
                    <div class="rounded bg-light text-dark px-3 py-1">
                        Full Forecast
                    </div>
                </div>
        
            </div>

            <div class="bg-secondary col rounded rounded-4 p-4 my-4" style="height: 200px;">
                <div class="fs-5">Temperature Range</div>
                <div class="mt-3">
                    <div class="bi bi-thermometer-low fs-3 fw-bold">
                        <span id="lblTempMin"></span>
                    </div>
                    <div class="bi bi-thermometer-high mt-2 fs-3 fw-bold">
                        <span id="lblTempMax"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
