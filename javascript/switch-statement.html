<script>
    var choice = prompt("Enter Choice", 'y or n');
    switch(choice){
        case "y": 
        case "Y": 
        document.write("You selected YES to continue");
        break;
        case "n":     
        case "N": 
        document.writeln("You selected NO to stop");
        break;
        default: 
        document.write("Please enter y or n only");
        break;
    }
</script>
