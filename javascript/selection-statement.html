<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forward Jump</title>

    <script>
        var userdetails = {
            Card: "4444555566667890",
            Cvv: "456",
            Expiry: "2027"
        };

        function VerifyCard() {
            var card = document.getElementById("card").value;

            if (card === userdetails.Card) {
                document.getElementById("cvvContainer").style.display = "block";
            } 
        }

        function VerifyCvv() {
            var cvv = document.getElementById("cvv").value;

            if (cvv === userdetails.Cvv) {
                document.getElementById("expiryContainer").style.display = "block";
            }
        }

        function VerifyExpiry() {
            var expiry = document.getElementById("expiry").value;

            if (expiry === userdetails.Expiry) {
                document.getElementById("btnPay").style.display = "block";
            }
        }

        
    </script>
</head>

<body>
    <h3>Payment</h3>

    <dl>
        <dt>Card</dt>
        <dd>
            <input type="text" id="card" onblur="VerifyCard()" placeholder="Enter Card Number">
        </dd>

        <div id="cvvContainer" style="display: none;">
            <dt>CVV</dt>
            <dd>
                <input type="text" id="cvv" size="4" onblur="VerifyCvv()" placeholder="Enter CVV">
            </dd>
        </div>

        <div id="expiryContainer" style="display: none;">
            <dt>Expiry</dt>
            <dd>
                <select id="expiry" onchange="VerifyExpiry()">
                    <option value="">Select Expiry</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
            </dd>
        </div>

        <button id="btnPay" style="display: none;">Pay</button>

    </dl>
</body>
</html>
