<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script>
        function Level1(){
            document.querySelector("p").innerHTML="Volume Increased : 50%" ;
        }
        function Level2(){
            document.querySelector("p").innerHTML="Volume Increased : 70%" ;
        }
        function Level3(){
            document.querySelector("p").innerHTML="Volume Full" ;
        }
        var l2;
        function VolumeClick(){
            setTimeout(Level1,4000);                                 //4000 means 4secs
            l2 = setTimeout(Level2,8000);                               
            setTimeout(Level3,15000);                              
        }
        function CancelClick(){
            clearTimeout(l2);
            alert("Cancelled");
        }
    </script>
</head>
<body>
    <button class="bi bi-volume-up-fill" onclick="VolumeClick()"></button>
    <button onclick="CancelClick()">Cancel 2</button>
    <p></p>
</body>
</html>
