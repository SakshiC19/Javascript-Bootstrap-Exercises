<script>
    class Demo{
        static s=0;
        n=0;
        Print(){
            Demo.s=Demo.s+1;
            this.n=this.n+1;
            document.write(`s=${Demo.s} n=${this.n}<br>`);

    let obj1=new Demo();
    obj1.Print();

    let obj2=new Demo();
    obj2.Print();

    let obj3=new Demo();
    obj3.Print();
</script>
