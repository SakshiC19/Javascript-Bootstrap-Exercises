<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../src/scripts/emi.js"></script>
    <style>
        .currency{
            position: absolute;
            left: 10px;
            top: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body class="container-fluid p-4">
    <div class="row mt-4" style="height: 400px; grid-gap: 5px;">
        <div class="col-6 rounded rounded-5 p-3" style="background-color: rgb(162, 220, 239);">
            <div class="mb-2">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Loan Amount</span>
            
                    <!-- ₹ inside textbox -->
                    <div style="position: relative; width:200px;">
                        <span class="currency">₹</span>
                        <input type="text" id="txtAmount" class="form-control" style="padding-left: 25px;">
                    </div>
                </div>
            </div>
            <div class="mb-2">
                <input type="range"  onchange="AmountChange()" id="rangeAmount" class="form-range" min="100000" max="1000000" value="100000" step="10000" class="form-range">
            </div>
            <div class="mb-2 d-flex justify-content-between fw-bold">
                <span>&#8377; 1,00,000</span>
                <span>&#8377; 10,00,000</span>
            </div>
            <div class="mt-5">
                <div class="d-flex justify-content-between">
                    <span class="fw-bold">Years</span>
                    <input type="text"   id="txtYears" style="width:80px;" class="form-control">
                </div>
            </div>
            <div class="mb-2">
                <input type="range" id="rangeYears" onchange="YearsChange()" class="form-range" min="1" max="7" value="1" step="1" class="form-range">
            </div>
            <div class="mb-2 d-flex justify-content-between fw-bold">
                <span>1 Year</span>
                <span>7 Years</span>
            </div>

            <div class="mt-5">
                <div class="d-flex justify-content-between">
                    <span class="fw-bold">Interest Rate</span>
                    <input type="text" id="txtRate" style="width:80px;" class="form-control">
                </div>
            </div>
            <div class="mb-2">
                <input type="range" id="rangeRate"  onchange="RateChange()" class="form-range" min="9.45" max="12.45" value="9.45" step="0.01" class="form-range">
            </div>
            <div class="mb-2 d-flex justify-content-between fw-bold">
                <span>9.45%</span>
                <span>12.45%</span>
            </div>
            <div class="text-center">
                <button class="btn btn-primary" onclick="CalculateClick()">Calculate</button>
            </div>
        </div>
        <div class="col-4 p-4 rounded rounded-5" style="background-color: rgb(164, 221, 240);">
            <h1>Installment Amount</h1>
            <div class="text-center mt-5 fw-bold fs-1" id="lblEmi">

            </div>
        </div>
    </div>
</body>
</html>
